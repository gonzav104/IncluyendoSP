# CI — Incluyendo SP (Frontend)
# Corre los tests en cada push a main y en cada pull request.
# Los tests son herméticos: vitest usa jsdom y no requieren backend ni red
# (fetch se stubbea y los datos vienen de JSON locales en src/data).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Correr tests
        run: npm test
